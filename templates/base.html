<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meals{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 0.5rem; }
    .meal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .meal-grid article { margin: 0; }
    .recipe { white-space: pre-wrap; }
    .flash-error { color: var(--pico-del-color); }
    .flash-success { color: var(--pico-ins-color); }
    .exact, .used-in { color: var(--pico-muted-color); }
    table.ingredients { margin-bottom: 0.5rem; }
    table.ingredients td { padding: 0.25rem; vertical-align: middle; }
    table.ingredients input { margin: 0; }
    table.ingredients .col-qty { width: 7.5rem; }
    table.ingredients .col-unit { width: 8.5rem; }
    table.ingredients .col-del { width: 3rem; }
    table.ingredients .remove-ingredient { margin: 0; padding: 0.4rem 0.6rem; }
    .not-scaled { color: var(--pico-muted-color); font-style: italic; }
    @media print {
      nav, .no-print, form, button, [role="button"] { display: none !important; }
      main.container { max-width: none; padding: 0; }
      table { font-size: 11pt; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="no-print">
      <ul><li><strong>Meals</strong></li></ul>
      <ul>
        <li><a href="{{ url_for('index') }}">Meals</a></li>
        <li><a href="{{ url_for('new_meal') }}">Add Meal</a></li>
        <li><a href="{{ url_for('events_list') }}">Events</a></li>
      </ul>
    </nav>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <article class="flash-{{ category }} no-print">{{ message }}</article>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
