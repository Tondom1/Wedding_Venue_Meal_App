{% extends "base.html" %}
{% block title %}{{ meal.name }}{% endblock %}
{% block content %}
  {% if meal.photo_filename %}
    <img src="{{ url_for('static', filename='uploads/' ~ meal.photo_filename) }}" alt="{{ meal.name }}" style="max-width: 100%; border-radius: 0.5rem;">
  {% endif %}

  <h1>{{ meal.name }}</h1>

  <h2>Ingredients</h2>
  <ul>
    {% for item in meal.ingredients | lines %}
      <li>{{ item }}</li>
    {% endfor %}
  </ul>

  <h2>Recipe</h2>
  <p class="recipe">{{ meal.recipe }}</p>

  <div role="group">
    <a href="{{ url_for('edit_meal', meal_id=meal.id) }}" role="button">Edit</a>
    <form method="post" action="{{ url_for('delete_meal', meal_id=meal.id) }}" style="margin: 0;">
      <button type="submit" class="secondary" onclick="return confirm('Delete this meal?')">Delete</button>
    </form>
  </div>
{% endblock %}
